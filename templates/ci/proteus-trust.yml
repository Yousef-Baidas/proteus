# .github/workflows/proteus-trust.yml — written by the Proteus scaffold ticket; copy it as is.
# The security trigger for every PR into proteus/*: proteus-security.js posts the commit status
# proteus/security on the PR head, success when no changed path matches the ```security block
# of teams/ROUTING.md, failure naming the paths until the security verifier signs off
# (proteus-signoff.js --security). The ruleset on proteus/* (install.js --protect) requires
# proteus/security, proteus/verdict (the verifier's MERGE) and gates.
# It runs on pull_request_target, so GitHub takes this file, the checkout and the script from
# the PR's base branch, never from the PR: a worker's PR cannot change what judges it. Never
# check out or run the PR's code in this file. The paths come from the API; the optional
# semgrep step below reads the head's files as data and runs nothing from them.
# A run branch cut before this file existed has no copy, so its PRs get no proteus/security
# from CI; finish such runs before the ruleset requires it (enforcement.md §1).
# Same hardening as proteus-gates.yml: ${{ }} reaches scripts only through env:, actions are
# pinned to a commit SHA, checkout does not persist the token, and the one write scope
# (statuses) sits on the one job that posts.
name: proteus-trust
on:
  pull_request_target:
    branches: ["proteus/**"]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # the base the PR targets, never its head
          persist-credentials: false
      # Optional: semgrep findings in the changed files also trigger the security verifier. To turn
      # it on, uncomment the three steps below and add --findings "$RUNNER_TEMP/semgrep.json" to the
      # check. The head is checked out as data under head/; nothing in it is run.
      #   - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      #     with: { ref: "${{ github.event.pull_request.head.sha }}", path: head, persist-credentials: false }
      #   - run: pipx install semgrep==<version>
      #   - run: cd head && semgrep scan --config p/security-audit --metrics off --json --output "$RUNNER_TEMP/semgrep.json" || test -s "$RUNNER_TEMP/semgrep.json"
      - name: security paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node teams/templates/hooks/proteus-security.js --ci "$PR_NUMBER" "$HEAD_SHA"
